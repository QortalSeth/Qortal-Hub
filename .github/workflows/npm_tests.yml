name: NPM Tests

on:
  push:
    branches:
      - 'develop'
      - 'master'
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  npm-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Node 22 is active LTS and matches engines.node in electron/package.json.
          # The Node 20 deprecation notice refers to the actions' own runner
          # runtime, not this input.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build test worker threads
        # Several suites spawn real worker_threads that load
        # electron/build/src/<name>.worker.js by absolute path. That directory is
        # produced by a compile and is gitignored, so a bare checkout has no
        # worker: every task fails with "Cannot find module", surfacing as
        # "Resource worker unavailable" and intermittent failures across
        # reticulum-chat / -resource-store / -resource-transfer.
        # These workers only import Node builtins, so compiling them directly
        # with esbuild (already a root devDependency) avoids installing the
        # separate electron/ project just to typecheck main-process code.
        run: |
          mkdir -p electron/build/src
          for worker in reticulum-resource reticulum-chat reticulum-media ed25519-verify; do
            npx --no-install esbuild "electron/src/${worker}.worker.ts" \
              --format=cjs --platform=node --target=node22 \
              --outfile="electron/build/src/${worker}.worker.js"
          done

      - name: Run tests
        # `npm test` is Vitest watch mode; it only exits in CI because Vitest
        # implicitly detects CI=true. Run explicitly so the behaviour does not
        # depend on that detection.
        run: npx vitest run
