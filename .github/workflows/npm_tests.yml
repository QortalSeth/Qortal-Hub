name: NPM Tests

on:
  push:
    branches:
      - 'develop'
      - 'master'
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  npm-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Node 22 is active LTS and matches engines.node in electron/package.json.
          # The Node 20 deprecation notice refers to the actions' own runner
          # runtime, not this input.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        # Must go through `npm test`, not `npx vitest run`: the `pretest` script
        # compiles the worker threads that several suites spawn by absolute path
        # (electron/build/src/*.worker.js, a gitignored build output). Bypassing
        # it leaves those workers missing and the reticulum suites fail with
        # "Cannot find module" / "Resource worker unavailable".
        # `-- --run` disables Vitest watch mode explicitly rather than relying on
        # Vitest inferring it from CI=true.
        run: npm test -- --run
